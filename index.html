<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoomDesk</title>
  <meta name="description" content="A mill desk for the web. Assign beams to looms and keep a khata. Records stay in this browser.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="mark" href="./">LoomDesk</a>
    <nav class="nav">
      <button type="button" data-view="floor" class="is-on">Floor</button>
      <button type="button" data-view="assign">Assign</button>
      <button type="button" data-view="khata">Khata</button>
    </nav>
    <a class="ghost" href="https://github.com/DhananiSneh/loomdesk">Source</a>
  </header>
  <main>
    <section id="floor" class="view">
      <h1>The floor</h1>
      <div id="floor-grid" class="grid"></div>
    </section>
    <section id="assign" class="view" hidden>
      <h1>Assign a beam</h1>
      <form id="assign-form">
        <select id="loom" name="loom" aria-label="Loom"></select>
        <input name="beam" required maxlength="80" placeholder="Beam" aria-label="Beam">
        <input name="worker" maxlength="80" placeholder="Worker" aria-label="Worker">
        <button type="submit">Light the loom</button>
      </form>
    </section>
    <section id="khata" class="view" hidden>
      <h1>Khata</h1>
      <p class="total">Open balance <strong id="total">₹ 0</strong></p>
      <form id="khata-form">
        <input name="party" required maxlength="80" placeholder="Party" aria-label="Party">
        <input name="amount" required type="number" step="1" placeholder="Amount" aria-label="Amount">
        <input name="note" maxlength="120" placeholder="Note" aria-label="Note">
        <button type="submit">Add line</button>
      </form>
      <ul id="khata-list"></ul>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
